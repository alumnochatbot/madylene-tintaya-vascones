<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbie & Ken: Dream Fashion Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Pacifico, Dancing Script & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons for tools and categories -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --barbie-pink: #e0218a;
      --barbie-deep: #b31268;
      --barbie-light: #ff7ec1;
      --barbie-pale: #fff0f7;
      --ken-blue: #0284c7;
      --ken-cyan: #06b6d4;
      --gold-sparkle: #f59e0b;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #ffebf5 0%, #fed7eb 40%, #fbcfe8 100%);
      color: #374151;
      overflow-x: hidden;
    }

    .font-barbie {
      font-family: 'Dancing Script', cursive;
    }

    .font-retro {
      font-family: 'Pacifico', cursive;
    }

    /* Custom Pink Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #fdf2f8;
    }
    ::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #db2777;
    }

    /* Sparkle & Float Animations */
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatSoft 3.5s ease-in-out infinite;
    }

    @keyframes shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-badge {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shine 3s infinite linear;
    }

    /* Doll Box Packaging styling */
    .doll-box-frame {
      border: 14px solid #db2777;
      box-shadow: 0 25px 50px -12px rgba(219, 39, 119, 0.45), inset 0 0 40px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .doll-box-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.05) 30%, transparent 60%);
      z-index: 40;
    }

    /* Layer transitions */
    .doll-svg-layer {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Interactive garment item cards */
    .wardrobe-card {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wardrobe-card:hover {
      transform: translateY(-4px) scale(1.03);
    }
    .wardrobe-card:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <!-- TOP HEADER & BRANDING BAR -->

    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

        </div>

  <!-- MODAL: PHOTO BOOTH POLAROID & EXPORT -->
  <div id="snapshot-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">

      <!-- POLAROID CARD PREVIEW -->

        <div class="w-full mt-3 px-2 flex justify-between items-end">

      <!-- Polaroid Actions -->
      <div class="w-full flex gap-3">
        <button onclick="downloadSnapshotPNG()" class="flex-1 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-pink-500/30 transition active:scale-95">

        ¡Guardado con éxito!
      </p>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-banner" class="fixed bottom-5 right-5 z-50 bg-gray-900/90 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 border border-pink-400/40">
    <i class="fa-solid fa-wand-magic text-pink-400"></i>
    <span id="toast-text">Mensaje</span>
  </div>
  <script>
    /* ==========================================================
       SYNTHESIZED SOUND EFFECTS ENGINE (Web Audio API)
       Pure Web Audio without external assets for 100% reliability
       ========================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }

      playSparkle() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);

          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.04);
          gain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + idx * 0.04 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.04 + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(this.ctx.currentTime + idx * 0.04);
          osc.stop(this.ctx.currentTime + idx * 0.04 + 0.28);
        });
      }

      playCamera() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        // Shutter snap
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.06);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);

        // Flash recharge beep
        setTimeout(() => {
          if (!this.ctx) return;
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(900, this.ctx.currentTime);
          gain2.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start();
          osc2.stop(this.ctx.currentTime + 0.16);
        }, 120);
      }
    }

    const sound = new SoundEngine();
    /* ==========================================================
       GAME DATA & OUTFIT DEFINITIONS
       ========================================================== */
    const GAME_STATE = {

    /* ==========================================================
       WARDROBE UI MANAGEMENT & INTERACTION LOGIC

    function updateGameView() {
      const isDuo = GAME_STATE.activeCharacter === 'duo';
      const isBarbie = GAME_STATE.activeCharacter === 'barbie' || isDuo;
      const isKen = GAME_STATE.activeCharacter === 'ken' || isDuo;

      if (isBarbie) renderBarbie(GAME_STATE.dolls.barbie, !isDuo);
      if (isKen) renderKen(GAME_STATE.dolls.ken, !isDuo);

      // Render Active Tab Buttons
      const tabB = document.getElementById('tab-barbie');
      const tabK = document.getElementById('tab-ken');
      const tabD = document.getElementById('tab-duo');

      const activeClass = "bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-sm";
      const inactiveClass = "text-pink-700 hover:text-pink-900";

      tabB.className = `flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold transition-all ${GAME_STATE.activeCharacter === 'barbie' ? activeClass : inactiveClass}`;
      tabK.className = `flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold transition-all ${GAME_STATE.activeCharacter === 'ken' ? activeClass : inactiveClass}`;
      tabD.className = `flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold transition-all ${GAME_STATE.activeCharacter === 'duo' ? activeClass : inactiveClass}`;

      document.getElementById('character-indicator').innerHTML = `Vestidor: <b class="text-pink-600 uppercase">${GAME_STATE.activeCharacter === 'duo' ? 'Barbie & Ken' : GAME_STATE.activeCharacter}</b>`;
      
      renderCategoryTabs();
      renderPaletteSwatches();
      renderWardrobeItems();
    }

    function switchActiveCharacter(charKey) {
      sound.playPop();
      GAME_STATE.activeCharacter = charKey;
      GAME_STATE.selectedCategory = 'hair';
      updateGameView();
      showToast(`Cambiado a: ${charKey === 'duo' ? 'Dúo Pasarela' : charKey.toUpperCase()}`);
    }

    function renderCategoryTabs() {
      const char = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      const container = document.getElementById('category-tabs');
      
      const categories = [
        { key: 'hair', label: 'Cabello', icon: 'fa-scissors' },
        { key: 'tops', label: 'Prendas', icon: 'fa-shirt' },
        { key: 'bottoms', label: 'Faldas/Shorts', icon: 'fa-vest' },
        ...(char === 'barbie' ? [{ key: 'dresses', label: 'Vestidos', icon: 'fa-person-dress' }] : []),
        { key: 'shoes', label: 'Zapatos', icon: 'fa-shoe-prints' },
        { key: 'accessories', label: 'Accesorios', icon: 'fa-gem' },
        { key: 'scenery', label: 'Escenario', icon: 'fa-panorama' }
      ];

      container.innerHTML = categories.map(cat => {
        const isActive = GAME_STATE.selectedCategory === cat.key;
        return `
          <button onclick="selectCategory('${cat.key}')" class="flex flex-col items-center justify-center p-2 rounded-2xl text-[11px] font-bold transition-all ${isActive ? 'bg-pink-600 text-white shadow-md shadow-pink-500/25 scale-105' : 'bg-pink-50 text-pink-700 hover:bg-pink-100'}">
            <i class="fa-solid ${cat.icon} text-sm mb-1"></i>
            <span class="truncate max-w-full">${cat.label}</span>
          </button>
        `;
      }).join('');
    }

    function selectCategory(catKey) {
      sound.playPop();
      GAME_STATE.selectedCategory = catKey;
      renderCategoryTabs();
      renderPaletteSwatches();
      renderWardrobeItems();
    }

    function renderPaletteSwatches() {
      const container = document.getElementById('palette-swatches');
      const label = document.getElementById('palette-label');
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      const doll = GAME_STATE.dolls[charKey];

      if (GAME_STATE.selectedCategory === 'hair') {
        label.innerText = "Color de Cabello:";
        container.innerHTML = HAIR_PALETTES.map(p => `
          <button onclick="changeHairColor('${p.hex}')" title="${p.name}" class="w-7 h-7 rounded-full border-2 transition transform hover:scale-110 active:scale-95 ${doll.hairColor === p.hex ? 'border-pink-600 ring-2 ring-pink-300' : 'border-white'}" style="background-color: ${p.hex};"></button>
        `).join('');
      } else if (GAME_STATE.selectedCategory === 'accessories' || GAME_STATE.selectedCategory === 'tops') {
        label.innerText = "Tono de Piel:";
        container.innerHTML = SKIN_OPTIONS.map(s => `
          <button onclick="changeSkinTone('${s.id}')" title="${s.label}" class="w-7 h-7 rounded-full border-2 transition transform hover:scale-110 active:scale-95 ${doll.skin === s.id ? 'border-pink-600 ring-2 ring-pink-300' : 'border-white'}" style="background-color: ${s.color};"></button>
        `).join('');
      } else {
        label.innerText = "Estilo de Temporada:";
        container.innerHTML = `
          <span class="text-xs font-semibold text-pink-600">Colección Rosa Glamour 2026</span>
        `;
      }
    }
    function renderWardrobeItems() {
      const container = document.getElementById('wardrobe-items-container');
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      const wardrobe = charKey === 'ken' ? KEN_WARDROBE : BARBIE_WARDROBE;
      const doll = GAME_STATE.dolls[charKey];
      const cat = GAME_STATE.selectedCategory;

      // Check if scenery category selected
      if (cat === 'scenery') {
        container.innerHTML = SCENIC_BACKGROUNDS.map((bg, idx) => `
          <div onclick="selectScenery(${idx})" class="wardrobe-card cursor-pointer p-3 rounded-2xl bg-white border-2 transition text-center ${GAME_STATE.currentSceneryIndex === idx ? 'border-pink-600 shadow-md shadow-pink-500/20' : 'border-pink-100 hover:border-pink-300'}">
            <div class="w-full h-16 rounded-xl mb-2 flex items-center justify-center text-white text-xl font-bold shadow-inner" style="${bg.cssStyle}">
              <i class="fa-solid fa-camera"></i>
            </div>
            <p class="text-xs font-bold text-gray-800 truncate">${bg.name}</p>
          </div>
        `).join('');
        return;
      }

      const items = wardrobe[cat] || [];
      container.innerHTML = items.map(item => {
        let isSelected = false;
        if (cat === 'hair') isSelected = doll.hairStyle === item.id;
        else if (cat === 'tops') isSelected = doll.top === item.id && (!doll.dress || doll.dress === 'none');
        else if (cat === 'bottoms') isSelected = doll.bottom === item.id && (!doll.dress || doll.dress === 'none');
        else if (cat === 'dresses') isSelected = doll.dress === item.id;
        else if (cat === 'shoes') isSelected = doll.shoes === item.id;
        else if (cat === 'accessories') isSelected = doll.accessory === item.id;

        return `
          <div onclick="applyWardrobeItem('${cat}', '${item.id}')" class="wardrobe-card cursor-pointer p-3 rounded-2xl bg-white border-2 transition flex flex-col justify-between items-center ${isSelected ? 'border-pink-600 ring-2 ring-pink-200 shadow-md' : 'border-pink-100 hover:border-pink-300'}">
            <div class="w-12 h-12 rounded-xl bg-pink-50 border border-pink-200 flex items-center justify-center text-pink-600 text-lg mb-2 shadow-inner" style="${item.color ? `background-color: ${item.color}20; color: ${item.color}; border-color: ${item.color};` : ''}">
              <i class="fa-solid ${item.icon || 'fa-sparkles'}"></i>
            </div>
            <span class="text-xs font-bold text-gray-800 text-center leading-tight mb-1 truncate w-full">${item.name}</span>
            <span class="text-[10px] text-gray-400 text-center truncate w-full">${item.desc || 'Oficial'}</span>
          </div>
        `;
      }).join('');
    }

    function applyWardrobeItem(cat, itemId) {
      sound.playSparkle();
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      const doll = GAME_STATE.dolls[charKey];

      if (cat === 'hair') doll.hairStyle = itemId;
      else if (cat === 'tops') {
        doll.top = itemId;
        doll.dress = 'none'; // Unset dress if top is selected
      } else if (cat === 'bottoms') {
        doll.bottom = itemId;
        doll.dress = 'none';
      } else if (cat === 'dresses') {
        doll.dress = itemId;
      } else if (cat === 'shoes') doll.shoes = itemId;
      else if (cat === 'accessories') doll.accessory = itemId;

      updateGameView();
    }

    function changeHairColor(colorHex) {
      sound.playPop();
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      GAME_STATE.dolls[charKey].hairColor = colorHex;
      updateGameView();
    }

    function changeSkinTone(toneId) {
      sound.playPop();
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      GAME_STATE.dolls[charKey].skin = toneId;
      updateGameView();
    }

    function selectScenery(index) {
      sound.playPop();
      GAME_STATE.currentSceneryIndex = index;
      const bg = SCENIC_BACKGROUNDS[index];
      document.getElementById('scenery-layer').style.cssText = bg.cssStyle;
      document.getElementById('label-scenery-name').innerText = bg.name;
      renderWardrobeItems();
      showToast(`Escenario: ${bg.name}`);
    }
    /* ==========================================================
       SPECIAL ACTIONS (Randomizer, Iconic Looks, Collector Box)
       ========================================================== */

    function randomizeCurrentOutfit() {
      sound.playSparkle();
      const bHair = BARBIE_WARDROBE.hair[Math.floor(Math.random() * BARBIE_WARDROBE.hair.length)].id;
      const bColor = HAIR_PALETTES[Math.floor(Math.random() * HAIR_PALETTES.length)].hex;
      const bTop = BARBIE_WARDROBE.tops[Math.floor(Math.random() * BARBIE_WARDROBE.tops.length)].id;
      const bBottom = BARBIE_WARDROBE.bottoms[Math.floor(Math.random() * BARBIE_WARDROBE.bottoms.length)].id;
      const bShoes = BARBIE_WARDROBE.shoes[Math.floor(Math.random() * BARBIE_WARDROBE.shoes.length)].id;
      const bAcc = BARBIE_WARDROBE.accessories[Math.floor(Math.random() * BARBIE_WARDROBE.accessories.length)].id;

      GAME_STATE.dolls.barbie = {
        skin: SKIN_OPTIONS[Math.floor(Math.random() * SKIN_OPTIONS.length)].id,
        hairStyle: bHair,
        hairColor: bColor,
        top: bTop,
        bottom: bBottom,
        dress: Math.random() > 0.6 ? 'gala_ballgown' : 'none',
        shoes: bShoes,
        accessory: bAcc,
        lipstick: '#ec4899'
      };

      const kHair = KEN_WARDROBE.hair[Math.floor(Math.random() * KEN_WARDROBE.hair.length)].id;
      const kTop = KEN_WARDROBE.tops[Math.floor(Math.random() * KEN_WARDROBE.tops.length)].id;
      const kBottom = KEN_WARDROBE.bottoms[Math.floor(Math.random() * KEN_WARDROBE.bottoms.length)].id;
      const kShoes = KEN_WARDROBE.shoes[Math.floor(Math.random() * KEN_WARDROBE.shoes.length)].id;
      const kAcc = KEN_WARDROBE.accessories[Math.floor(Math.random() * KEN_WARDROBE.accessories.length)].id;

      GAME_STATE.dolls.ken = {
        skin: SKIN_OPTIONS[Math.floor(Math.random() * SKIN_OPTIONS.length)].id,
        hairStyle: kHair,
        hairColor: HAIR_PALETTES[Math.floor(Math.random() * HAIR_PALETTES.length)].hex,
        top: kTop,
        bottom: kBottom,
        shoes: kShoes,
        accessory: kAcc,
        lipstick: '#f43f5e'
      };

      updateGameView();
      showToast("¡Estilismo sorpresa generado!");
    }

    function applySignatureStyle() {
      sound.playSparkle();
      // Sets the quintessential Margot & Ryan roller disco outfit match
      GAME_STATE.dolls.barbie = {
        skin: 'fair',
        hairStyle: 'high_pony',
        hairColor: '#fef08a',
        top: 'roller_disco',
        bottom: 'roller_shorts',
        dress: 'none',
        shoes: 'pink_roller',
        accessory: 'roller_visor',
        lipstick: '#ec4899'
      };

      GAME_STATE.dolls.ken = {
        skin: 'tan',
        hairStyle: 'surf_wave',
        hairColor: '#facc15',
        top: 'kenough_hoodie',
        bottom: 'denim_shorts',
        shoes: 'roller_yellow',
        accessory: 'sunglasses_aviator',
        lipstick: '#f43f5e'
      };

      updateGameView();
      showToast("¡Outfit Oficial de Pasarela Aplicado!");
    }

    function resetCurrentDoll() {
      sound.playPop();
      const charKey = GAME_STATE.activeCharacter === 'ken' ? 'ken' : 'barbie';
      if (charKey === 'barbie') {
        GAME_STATE.dolls.barbie = {
          skin: 'fair',
          hairStyle: 'high_pony',
          hairColor: '#fde047',
          top: 'gingham_crop',
          bottom: 'gingham_skirt',
          dress: null,
          shoes: 'pink_roller',
          accessory: 'cat_sunglasses',
          lipstick: '#e11d48'
        };
      } else {
        GAME_STATE.dolls.ken = {
          skin: 'tan',
          hairStyle: 'surf_wave',
          hairColor: '#f59e0b',
          top: 'kenough_hoodie',
          bottom: 'denim_shorts',
          shoes: 'sneakers_white',
          accessory: 'sunglasses_aviator',
          lipstick: '#f43f5e'
        };
      }
      updateGameView();
      showToast("Estilo restablecido.");
    }

    function toggleDollBox() {
      sound.playPop();
      GAME_STATE.isBoxMode = !GAME_STATE.isBoxMode;
      const boxBorder = document.getElementById('toy-box-border');
      const boxGraphics = document.getElementById('box-overlay-graphics');
      const btn = document.getElementById('btn-toggle-box');

      if (GAME_STATE.isBoxMode) {
        boxBorder.classList.remove('hidden');
        boxGraphics.style.display = 'inline';
        btn.classList.add('bg-pink-600', 'text-white');
        btn.classList.remove('bg-pink-50', 'text-pink-600');
        showToast("¡Modo Caja de Colección Activado!");
      } else {
        boxBorder.classList.add('hidden');
        boxGraphics.style.display = 'none';
        btn.classList.remove('bg-pink-600', 'text-white');
        btn.classList.add('bg-pink-50', 'text-pink-600');
        showToast("Modo Caja Desactivado.");
      }
    }

    function toggleAudio() {
      sound.enabled = !sound.enabled;
      const icon = document.getElementById('sound-icon');
      if (sound.enabled) {
        icon.className = 'fa-solid fa-volume-high text-base';
        sound.playPop();
        showToast("Sonidos activados.");
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-base text-gray-400';
        showToast("Sonidos desactivados.");
      }
    }

    function showToast(message) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-text').innerText = message;
      banner.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        banner.classList.add('translate-y-20', 'opacity-0');
      }, 2400);
    }
    /* ==========================================================
       PHOTO BOOTH & POLAROID EXPORT (SVG to HTML5 Canvas)
       ========================================================== */

    function openSnapshotModal() {
      sound.playCamera();
      const modal = document.getElementById('snapshot-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      // Draw SVG to Canvas for export
      const svgElement = document.getElementById('doll-canvas');
      const canvas = document.getElementById('export-canvas');
      const ctx = canvas.getContext('2d');

      const xml = new XMLSerializer().serializeToString(svgElement);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const b64Start = 'data:image/svg+xml;base64,';
      const image64 = b64Start + svg64;

      const img = new Image();
      img.onload = function() {
        // Draw scenic background gradient first
        const bg = SCENIC_BACKGROUNDS[GAME_STATE.currentSceneryIndex];
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#fce7f3');
        grad.addColorStop(0.5, '#f472b6');
        grad.addColorStop(1, '#db2777');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw rendered dolls
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Watermark / Collector stamp
        ctx.font = "bold 24px 'Dancing Script', cursive";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "right";
        ctx.fillText("Barbie & Ken Studio", canvas.width - 24, canvas.height - 24);
      };
      img.src = image64;
    }

    function closeSnapshotModal() {
      sound.playPop();
      const modal = document.getElementById('snapshot-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function downloadSnapshotPNG() {
      sound.playPop();
      const canvas = document.getElementById('export-canvas');
      const link = document.createElement('a');
      link.download = `Barbie-y-Ken-Fashion-Studio-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      const toast = document.getElementById('modal-toast');
      toast.innerText = "¡Foto descargada a tu galería!";
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2200);
    }

    function copySnapshotLink() {
      sound.playPop();
      // Using execCommand for safe iframe clipboard copy
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = window.location.href;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const toast = document.getElementById('modal-toast');
      toast.innerText = "¡Enlace del estudio copiado!";
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    // Sparkle Floating Elements Initializer
    function initSparkles() {
      const container = document.getElementById('sparkle-particles');
      container.innerHTML = '';
      for (let i = 0; i < 18; i++) {
        const span = document.createElement('span');
        const size = Math.random() * 12 + 6;
        span.className = 'absolute text-yellow-300 font-bold select-none pointer-events-none animate-pulse';
        span.style.left = `${Math.random() * 95}%`;
        span.style.top = `${Math.random() * 95}%`;
        span.style.fontSize = `${size}px`;
        span.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
        span.innerHTML = '✦';
        container.appendChild(span);
      }
    }

    // Window Onload initialization
    window.onload = function() {
      selectScenery(0);
      initSparkles();
      updateGameView();
    };
  </script>
</body>
</html>
