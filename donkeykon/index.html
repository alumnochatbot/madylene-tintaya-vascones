<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Platformer - Donkey Kong Classic Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #050505;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .arcade-frame {
            border: 4px solid #ff0055;
            box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055;
        }
        .retro-btn {
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 2px solid #555;
            box-shadow: 0 4px 0 #000;
            active: border-color #fff;
        }
        .retro-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 select-none overflow-hidden">

    <!-- Header / Scoreboard -->
    <div class="w-full max-w-md flex justify-between items-center mb-2 px-4 text-xs sm:text-sm text-yellow-400">
        <div>SCORE: <span id="score">000000</span></div>
        <div class="text-green-400">NIVEL: <span id="level">1</span>/20</div>
        <div class="text-red-500">HIGH: <span id="highScore">005000</span></div>
    </div>

    <!-- Main Game Container -->
    <div class="relative w-full max-w-md aspect-[4/5] arcade-frame rounded-lg overflow-hidden bg-black flex flex-col items-center justify-center">
        <!-- Canvas Game Screen -->
        <canvas id="gameCanvas" width="400" height="500" class="w-full h-full block"></canvas>

        <!-- Overlay UI (Start / Game Over Screens) -->
        <div id="startOverlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-10">
            <h1 class="text-2xl text-red-500 mb-2 font-bold animate-pulse">DONKEY CLIMB</h1>
            <p class="text-xs text-cyan-400 mb-6">RESCUA A LA PRINCESA</p>
            <p class="text-[10px] text-gray-300 mb-6 leading-relaxed">
                Usa Flechas o A/D para moverte.<br>
                Flecha Arriba/Abajo para subir escaleras.<br>
                ESPACIO para saltar barriles.
            </p>
            <button id="startBtn" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white text-xs rounded border-2 border-yellow-400 shadow-lg cursor-pointer transform active:scale-95 transition">
                ¡JUGAR AH0RA!
            </button>
        </div>

        <div id="gameOverOverlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-10">
            <h2 id="gameOverTitle" class="text-2xl text-red-600 mb-2">GAME OVER</h2>
            <p id="finalScore" class="text-xs text-yellow-400 mb-6">SCORE: 000000</p>
            <button id="restartBtn" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-400 text-black text-xs font-bold rounded border-2 border-white shadow-lg cursor-pointer transform active:scale-95 transition">
                REINTENTAR
            </button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-md grid grid-cols-3 gap-2 mt-3 sm:hidden px-2">
        <div class="grid grid-cols-2 gap-1">
            <button id="btnLeft" class="retro-btn p-4 rounded text-center text-xl flex items-center justify-center active:bg-gray-700">◀</button>
            <button id="btnRight" class="retro-btn p-4 rounded text-center text-xl flex items-center justify-center active:bg-gray-700">▶</button>
        </div>
        <div class="grid grid-cols-2 gap-1">
            <button id="btnUp" class="retro-btn p-4 rounded text-center text-xl flex items-center justify-center active:bg-gray-700">▲</button>
            <button id="btnDown" class="retro-btn p-4 rounded text-center text-xl flex items-center justify-center active:bg-gray-700">▼</button>
        </div>
        <div>
            <button id="btnJump" class="retro-btn w-full h-full rounded bg-red-800 text-white text-xs font-bold flex items-center justify-center active:bg-red-600">SALTO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game UI elements
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const highScoreEl = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Highscore from localstorage
        let highScore = localStorage.getItem('dk_highscore') || 5000;
        highScoreEl.innerText = String(highScore).padStart(6, '0');

        let score = 0;
        let currentLevel = 1;
        let lives = 5;
        let gameRunning = false;
        let animationFrameId;
        let barrelSpawnTimer = 0;
        let barrelSpawnInterval = 240;

        // Key states
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false,
            jump: false
        };

        // Platform and ladder templates for 20 unique levels
        function getLevelData(lvl) {
            // Cycle 4 main structural variations across 20 levels
            const layoutType = (lvl - 1) % 4;

            let girders = [];
            let ladders = [];

            if (layoutType === 0) {
                // Classic Zig-Zag
                girders = [
                    { x1: 160, y1: 60, x2: 240, y2: 60 },
                    { x1: 20, y1: 120, x2: 170, y2: 120 },
                    { x1: 20, y1: 180, x2: 380, y2: 195 },
                    { x1: 20, y1: 270, x2: 380, y2: 255 },
                    { x1: 20, y1: 330, x2: 380, y2: 345 },
                    { x1: 0, y1: 430, x2: 400, y2: 415 },
                    { x1: 0, y1: 480, x2: 400, y2: 480 }
                ];
                ladders = [
                    { x: 200, y1: 60, y2: 120 },
                    { x: 100, y1: 120, y2: 183 },
                    { x: 300, y1: 190, y2: 260 },
                    { x: 120, y1: 265, y2: 335 },
                    { x: 280, y1: 340, y2: 420 },
                    { x: 60, y1: 335, y2: 425 }
                ];
            } else if (layoutType === 1) {
                // Central Pyramid Tower
                girders = [
                    { x1: 160, y1: 60, x2: 240, y2: 60 },
                    { x1: 20, y1: 120, x2: 170, y2: 120 },
                    { x1: 50, y1: 190, x2: 350, y2: 190 },
                    { x1: 20, y1: 270, x2: 200, y2: 280 },
                    { x1: 200, y1: 280, x2: 380, y2: 270 },
                    { x1: 40, y1: 360, x2: 360, y2: 360 },
                    { x1: 0, y1: 480, x2: 400, y2: 480 }
                ];
                ladders = [
                    { x: 200, y1: 60, y2: 120 },
                    { x: 120, y1: 120, y2: 190 },
                    { x: 200, y1: 190, y2: 275 },
                    { x: 90, y1: 275, y2: 360 },
                    { x: 310, y1: 275, y2: 360 },
                    { x: 200, y1: 360, y2: 480 }
                ];
            } else if (layoutType === 2) {
                // Alternating Split Platforms
                girders = [
                    { x1: 160, y1: 60, x2: 240, y2: 60 },
                    { x1: 20, y1: 120, x2: 170, y2: 120 },
                    { x1: 20, y1: 180, x2: 220, y2: 195 },
                    { x1: 180, y1: 260, x2: 380, y2: 245 },
                    { x1: 20, y1: 330, x2: 220, y2: 345 },
                    { x1: 180, y1: 410, x2: 380, y2: 395 },
                    { x1: 0, y1: 480, x2: 400, y2: 480 }
                ];
                ladders = [
                    { x: 200, y1: 60, y2: 120 },
                    { x: 100, y1: 120, y2: 185 },
                    { x: 200, y1: 193, y2: 250 },
                    { x: 200, y1: 250, y2: 338 },
                    { x: 200, y1: 343, y2: 400 },
                    { x: 300, y1: 400, y2: 480 },
                    { x: 80, y1: 338, y2: 480 }
                ];
            } else {
                // Wide Steep Ascent
                girders = [
                    { x1: 160, y1: 60, x2: 240, y2: 60 },
                    { x1: 20, y1: 120, x2: 170, y2: 120 },
                    { x1: 10, y1: 200, x2: 390, y2: 180 },
                    { x1: 10, y1: 280, x2: 390, y2: 300 },
                    { x1: 10, y1: 390, x2: 390, y2: 370 },
                    { x1: 0, y1: 480, x2: 400, y2: 480 }
                ];
                ladders = [
                    { x: 200, y1: 60, y2: 120 },
                    { x: 140, y1: 120, y2: 193 },
                    { x: 320, y1: 183, y2: 295 },
                    { x: 80, y1: 285, y2: 383 },
                    { x: 250, y1: 377, y2: 480 }
                ];
            }

            return { girders, ladders };
        }

        let currentLevelData = getLevelData(1);
        let girders = currentLevelData.girders;
        let ladders = currentLevelData.ladders;

        // Player state
        const player = {
            x: 50,
            y: 450,
            width: 16,
            height: 20,
            vx: 0,
            vy: 0,
            speed: 3,
            jumpPower: -6.5,
            grounded: false,
            climbing: false,
            facing: 'right',
            animFrame: 0
        };

        // Donkey Kong & Pauline Position
        const kong = { x: 40, y: 80, width: 40, height: 40, state: 'idle' };
        const pauline = { x: 190, y: 32, width: 16, height: 24 };

        // Barrels array
        let barrels = [];

        // Calculate platform surface height at given X coordinate
        function getPlatformY(x, yPlayer) {
            for (let g of girders) {
                if (x >= Math.min(g.x1, g.x2) && x <= Math.max(g.x1, g.x2)) {
                    let slope = (g.y2 - g.y1) / (g.x2 - g.x1);
                    let targetY = g.y1 + slope * (x - g.x1);
                    if (Math.abs(yPlayer - targetY) < 18) {
                        return targetY;
                    }
                }
            }
            return null;
        }

        // Check ladder proximity
        function getLadderAt(x, y) {
            for (let l of ladders) {
                if (Math.abs(x - l.x) < 12 && y >= l.y1 - 5 && y <= l.y2 + 5) {
                    return l;
                }
            }
            return null;
        }

        function resetPlayer() {
            player.x = 40;
            player.y = 450;
            player.vx = 0;
            player.vy = 0;
            player.climbing = false;
            player.grounded = true;
        }

        function loadLevel(lvl) {
            currentLevel = lvl;
            currentLevelData = getLevelData(lvl);
            girders = currentLevelData.girders;
            ladders = currentLevelData.ladders;
            barrels = [];
            barrelSpawnTimer = 0;
            
            // Adjust barrel spawn frequency per level (gradually slightly faster)
            barrelSpawnInterval = Math.max(120, 250 - (lvl * 6));
            
            resetPlayer();
            updateScoreUI();
        }

        function initGame() {
            score = 0;
            lives = 5;
            loadLevel(1);
            gameRunning = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function updateScoreUI() {
            scoreEl.innerText = String(score).padStart(6, '0');
            levelEl.innerText = currentLevel;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dk_highscore', highScore);
                highScoreEl.innerText = String(highScore).padStart(6, '0');
            }
        }

        function spawnBarrel() {
            // Speed slowly increases per level
            const speedMult = 1 + (currentLevel - 1) * 0.05;
            barrels.push({
                x: kong.x + 35,
                y: kong.y + 20,
                radius: 7,
                vx: 1.2 * speedMult,
                vy: 0,
                dir: 1
            });
        }

        // --- Main Update Loop ---
        function update() {
            if (!gameRunning) return;

            // Spawn Barrels periodically
            barrelSpawnTimer++;
            if (barrelSpawnTimer > barrelSpawnInterval) {
                spawnBarrel();
                barrelSpawnTimer = 0;
            }

            // Player Climbing Check
            const currentLadder = getLadderAt(player.x + player.width / 2, player.y + player.height);

            if (currentLadder) {
                if (keys.up || keys.down) {
                    player.climbing = true;
                    player.vx = 0;
                }
            } else {
                player.climbing = false;
            }

            if (player.climbing && currentLadder) {
                player.vy = 0;
                if (keys.up) player.y -= 1.8;
                if (keys.down) player.y += 1.8;

                player.x = currentLadder.x - player.width / 2;

                if (player.y + player.height < currentLadder.y1) {
                    player.climbing = false;
                }
            } else {
                player.vy += 0.25;

                if (keys.left) {
                    player.vx = -player.speed;
                    player.facing = 'left';
                } else if (keys.right) {
                    player.vx = player.speed;
                    player.facing = 'right';
                } else {
                    player.vx = 0;
                }

                if (keys.jump && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }

                player.x += player.vx;
                player.y += player.vy;

                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                let feetX = player.x + player.width / 2;
                let feetY = player.y + player.height;
                let platY = getPlatformY(feetX, feetY);

                if (platY !== null && player.vy >= 0) {
                    player.y = platY - player.height;
                    player.vy = 0;
                    player.grounded = true;
                } else {
                    player.grounded = false;
                }
            }

            // Update Barrels
            for (let i = barrels.length - 1; i >= 0; i--) {
                let b = barrels[i];

                let bPlatY = getPlatformY(b.x, b.y + b.radius);
                if (bPlatY !== null) {
                    b.y = bPlatY - b.radius;
                    b.vy = 0;
                } else {
                    b.vy += 0.2;
                }

                b.x += b.vx;
                b.y += b.vy;

                if (b.x - b.radius <= 10 || b.x + b.radius >= canvas.width - 10) {
                    b.vx = -b.vx;
                }

                if (b.y > canvas.height + 20) {
                    barrels.splice(i, 1);
                    score += 50;
                    updateScoreUI();
                    continue;
                }

                let dx = (player.x + player.width / 2) - b.x;
                let dy = (player.y + player.height / 2) - b.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < b.radius + player.width / 2 - 2) {
                    handlePlayerDeath();
                    return;
                }
            }

            // Check Rescue Pauline (Advance level / Win Game)
            if (player.x + player.width > pauline.x &&
                player.x < pauline.x + pauline.width &&
                player.y < pauline.y + pauline.height) {
                
                score += 1000 * currentLevel;
                if (currentLevel < 20) {
                    loadLevel(currentLevel + 1);
                } else {
                    // Won all 20 levels!
                    gameRunning = false;
                    gameOverTitle.innerText = "¡VICTORIA TOTAL!";
                    finalScoreEl.innerText = `¡COMPLETASTE LOS 20 NIVELES!\nPUNTAJE: ${score}`;
                    gameOverOverlay.classList.remove('hidden');
                }
            }
        }

        function handlePlayerDeath() {
            lives--;
            if (lives <= 0) {
                gameRunning = false;
                gameOverTitle.innerText = "GAME OVER";
                finalScoreEl.innerText = `NIVEL ALCANZADO: ${currentLevel}\nPUNTAJE: ${score}`;
                gameOverOverlay.classList.remove('hidden');
            } else {
                resetPlayer();
                barrels = [];
            }
        }

        // --- Render Functions ---
        function draw() {
            // Clear background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Girders (Steel Beam Platform Effect)
            for (let g of girders) {
                ctx.strokeStyle = '#e6005c'; // Classic Retro Pink/Red
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(g.x1, g.y1);
                ctx.lineTo(g.x2, g.y2);
                ctx.stroke();

                // Girder pattern cross-hatching
                ctx.strokeStyle = '#ff6699';
                ctx.lineWidth = 1;
                let dist = Math.hypot(g.x2 - g.x1, g.y2 - g.y1);
                let steps = Math.floor(dist / 8);
                for (let i = 0; i <= steps; i++) {
                    let px = g.x1 + (g.x2 - g.x1) * (i / steps);
                    let py = g.y1 + (g.y2 - g.y1) * (i / steps);
                    ctx.beginPath();
                    ctx.moveTo(px, py - 3);
                    ctx.lineTo(px, py + 3);
                    ctx.stroke();
                }
            }

            // Draw Ladders
            for (let l of ladders) {
                ctx.strokeStyle = '#00ffff'; // Cyan Ladders
                ctx.lineWidth = 3;

                // Sides
                ctx.beginPath();
                ctx.moveTo(l.x - 6, l.y1);
                ctx.lineTo(l.x - 6, l.y2);
                ctx.moveTo(l.x + 6, l.y1);
                ctx.lineTo(l.x + 6, l.y2);
                ctx.stroke();

                // Rungs
                ctx.lineWidth = 1.5;
                for (let ry = l.y1 + 4; ry < l.y2; ry += 6) {
                    ctx.beginPath();
                    ctx.moveTo(l.x - 6, ry);
                    ctx.lineTo(l.x + 6, ry);
                    ctx.stroke();
                }
            }

            // Draw Donkey Kong
            ctx.fillStyle = '#b33c00'; // Gorilla Fur
            ctx.fillRect(kong.x, kong.y, kong.width, kong.height);
            // Kong Face & Belly
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(kong.x + 10, kong.y + 10, 20, 20);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(kong.x + 12, kong.y + 12, 5, 5);
            ctx.fillRect(kong.x + 23, kong.y + 12, 5, 5);

            // Draw Pauline (Princesa)
            ctx.fillStyle = '#ff33cc'; // Dress
            ctx.fillRect(pauline.x, pauline.y + 8, pauline.width, pauline.height - 8);
            ctx.fillStyle = '#ffcc99'; // Face
            ctx.fillRect(pauline.x + 3, pauline.y, 10, 8);
            ctx.fillStyle = '#ffff00'; // Hair
            ctx.fillRect(pauline.x, pauline.y - 2, 16, 4);

            // Draw Player (Mario-like retro pixel style)
            ctx.fillStyle = '#ff0000'; // Red Overalls/Shirt
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#0000ff'; // Blue Pants
            ctx.fillRect(player.x, player.y + 12, player.width, 8);
            ctx.fillStyle = '#ffcc99'; // Face
            let faceOffsetX = player.facing === 'right' ? 6 : 0;
            ctx.fillRect(player.x + faceOffsetX, player.y + 2, 10, 6);

            // Draw Barrels
            for (let b of barrels) {
                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#884400';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Lives display (bottom left)
            ctx.fillStyle = '#ff0000';
            for (let i = 0; i < lives; i++) {
                ctx.fillRect(15 + i * 18, 485, 12, 12);
            }
        }

        // Loop wrapper
        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Keyboard Controllers
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space') keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space') keys.jump = false;
        });

        // Touch Control Binding Helpers
        function bindTouch(elementId, keyProp) {
            const btn = document.getElementById(elementId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
            btn.addEventListener('mousedown', () => { keys[keyProp] = true; });
            btn.addEventListener('mouseup', () => { keys[keyProp] = false; });
        }

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnUp', 'up');
        bindTouch('btnDown', 'down');
        bindTouch('btnJump', 'jump');

        // Buttons
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        // Render initial static preview
        draw();
    </script>
</body>
</html>
