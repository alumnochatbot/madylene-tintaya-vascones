<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de Memoria - Frutas y Verduras</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Tone.js para efectos de sonido sin dependencias de archivos externos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    body {
      font-family: 'Fredoka', 'Nunito', cursive, sans-serif;
      background: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f4ede4 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Perspectiva y animación 3D de las cartas */
    .card-scene {
      perspective: 1000px;
    }

    .card-container {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .card-container.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Reverso de la carta: diseño lila con patrón ornamental idéntico al juego */
    .card-back {
      background-color: #925f9b;
      border: 3.5px solid #784581;
      box-shadow: 0 6px 14px -3px rgba(110, 50, 120, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.25) 3px, transparent 4px),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.25) 3px, transparent 4px),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.18) 4px, transparent 5px),
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255, 255, 255, 0.06) 10px, rgba(255, 255, 255, 0.06) 20px);
    }

    /* Frente de la carta: marco lila/morado y fondo blanco como en la foto */
    .card-front {
      background-color: #ffffff;
      border: 3.5px solid #8e548f;
      transform: rotateY(180deg);
      box-shadow: 0 6px 14px -3px rgba(0, 0, 0, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    /* Estado de carta emparejada */
    .card-container.is-matched .card-front {
      border-color: #22c55e;
      background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
      animation: pulseMatch 0.6s ease-in-out;
    }

    /* Efecto sacudida en descarte incorrecto */
    @keyframes shakeCard {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }

    .card-container.shake {
      animation: shakeCard 0.45s ease-in-out;
    }

    @keyframes pulseMatch {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* Estilo del botón amarillo brillante tipo banner */
    .game-title-banner {
      background: #f59e0b;
      box-shadow: 0 6px 0 #d97706, 0 10px 15px -3px rgba(217, 119, 6, 0.4);
    }

    .btn-bounce {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-bounce:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-3 sm:p-5 select-none overflow-x-hidden">

  <!-- Encabezado superior con puntuaciones y controles -->
  <header class="w-full max-w-4xl flex flex-col gap-3 items-center">
    
    <!-- Barra superior de título estilo juego de la imagen -->
    <div class="w-full flex items-center justify-between bg-amber-500 rounded-2xl px-5 py-3 shadow-[0_5px_0_#d97706] border-2 border-amber-600/30">
      <div class="flex items-center gap-3">
        <span class="text-3xl filter drop-shadow">🍉</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-white uppercase drop-shadow-[0_2px_2px_rgba(0,0,0,0.25)]">
          MEMORY GAME
        </h1>
      </div>

      <!-- Botones de acción rápida: Sonido y Reglas -->
      <div class="flex items-center gap-2">
        <button id="btnHint" title="Revelar pista rápida" class="btn-bounce bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl border border-white/40 flex items-center justify-center font-bold text-sm">
          💡 <span class="hidden sm:inline ml-1 text-xs uppercase tracking-wide">Pista</span>
        </button>
        <button id="btnSound" title="Activar/Silenciar sonido" class="btn-bounce bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl border border-white/40 flex items-center justify-center">
          <span id="soundIcon" class="text-lg">🔊</span>
        </button>
      </div>
    </div>

    <!-- Tablero de estado: Movimientos, Tiempo, Parejas y Nivel -->
    <div class="w-full grid grid-cols-4 gap-2 sm:gap-3 bg-white/90 backdrop-blur rounded-2xl p-2.5 sm:p-3 shadow-md border border-amber-100">
      
      <!-- Movimientos -->
      <div class="flex flex-col items-center justify-center p-1.5 sm:p-2 bg-amber-50/70 rounded-xl border border-amber-200/60">
        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-700">Intentos</span>
        <span id="moveCount" class="text-lg sm:text-2xl font-black text-amber-900 leading-tight">0</span>
      </div>

      <!-- Parejas encontradas -->
      <div class="flex flex-col items-center justify-center p-1.5 sm:p-2 bg-purple-50/70 rounded-xl border border-purple-200/60">
        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-purple-700">Parejas</span>
        <div class="flex items-baseline">
          <span id="matchCount" class="text-lg sm:text-2xl font-black text-purple-900 leading-tight">0</span>
          <span id="totalPairsLabel" class="text-xs font-bold text-purple-500 ml-0.5">/10</span>
        </div>
      </div>

      <!-- Tiempo -->
      <div class="flex flex-col items-center justify-center p-1.5 sm:p-2 bg-emerald-50/70 rounded-xl border border-emerald-200/60">
        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-emerald-700">Tiempo</span>
        <span id="timerText" class="text-lg sm:text-2xl font-black text-emerald-900 font-mono leading-tight">00:00</span>
      </div>

      <!-- Calificación de estrellas -->
      <div class="flex flex-col items-center justify-center p-1.5 sm:p-2 bg-rose-50/70 rounded-xl border border-rose-200/60">
        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-rose-700">Precisión</span>
        <div id="starContainer" class="flex gap-0.5 text-base sm:text-lg text-amber-400">
          <span>★</span><span>★</span><span>★</span>
        </div>
      </div>
    </div>

    <!-- Selector de dificultad y reinicio -->
    <div class="w-full flex items-center justify-between gap-2 px-1">
      <div class="flex items-center gap-1.5 bg-slate-200/80 p-1 rounded-xl text-xs sm:text-sm font-bold text-slate-700">
        <button data-diff="easy" class="diff-btn px-2.5 py-1 rounded-lg transition-colors hover:bg-white/60">Fácil (12)</button>
        <button data-diff="classic" class="diff-btn px-2.5 py-1 rounded-lg bg-white shadow-sm text-purple-800 transition-colors">Clásico (20)</button>
        <button data-diff="hard" class="diff-btn px-2.5 py-1 rounded-lg transition-colors hover:bg-white/60">Experto (24)</button>
      </div>

      <button id="btnRestart" class="btn-bounce bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-xl shadow-[0_3px_0_#b45309] flex items-center gap-1">
        <span>🔄</span> <span>Reiniciar</span>
      </button>
    </div>
  </header>

  <!-- Tablero de Cartas (Grid interactivo) -->
  <main class="w-full max-w-4xl flex-1 flex items-center justify-center my-3 sm:my-4">
    <div id="gridBoard" class="grid gap-2.5 sm:gap-3.5 w-full max-w-[620px] aspect-[5/4] p-1.5 sm:p-2">
      <!-- Las cartas se inyectan dinámicamente mediante JavaScript -->
    </div>
  </main>

  <!-- Pie de página con banner temático como en la imagen -->
  <footer class="w-full max-w-4xl flex items-center justify-between text-xs font-semibold text-slate-500 px-2 py-1">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>¡Encuentra todas las parejas de frutas y setas!</span>
    </div>
    <div class="text-right">
      <span>Récord: <span id="bestRecordText" class="font-bold text-purple-700">--:--</span></span>
    </div>
  </footer>

  <!-- Modal de Victoria (Celebración al ganar) -->
  <div id="winModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 transform scale-90 transition-transform duration-300" id="winCard">
      
      <!-- Trofeo / Estrellas -->
      <div class="w-20 h-20 mx-auto -mt-14 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center shadow-lg border-4 border-white text-4xl">
        🏆
      </div>

      <h2 class="text-3xl font-extrabold text-amber-600 mt-3 uppercase tracking-wide">¡Excelente!</h2>
      <p class="text-slate-600 text-sm mt-1">¡Has completado el juego de memoria con gran destreza!</p>

      <!-- Resumen de Estadísticas -->
      <div class="bg-amber-50 rounded-2xl p-4 my-5 border border-amber-200/80 flex flex-col gap-2">
        <div class="flex justify-between items-center text-sm font-semibold">
          <span class="text-slate-600">⏱️ Tiempo total:</span>
          <span id="winTime" class="text-amber-800 font-bold font-mono text-base">00:00</span>
        </div>
        <div class="flex justify-between items-center text-sm font-semibold">
          <span class="text-slate-600">🎯 Intentos:</span>
          <span id="winMoves" class="text-amber-800 font-bold text-base">0</span>
        </div>
        <div class="flex justify-between items-center text-sm font-semibold">
          <span class="text-slate-600">⭐ Calificación:</span>
          <span id="winStars" class="text-amber-500 font-bold text-lg">★★★</span>
        </div>
      </div>

      <!-- Botones del modal -->
      <div class="flex flex-col gap-2.5">
        <button id="btnPlayAgain" class="btn-bounce w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-lg rounded-2xl shadow-[0_4px_0_#b45309]">
          ¡Jugar Otra Vez!
        </button>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 font-bold text-xs py-1">
          Cerrar vista
        </button>
      </div>
    </div>
  </div>

            <!-- Sombrerete redondeado color café avellana -->
            <path d="M 22 54 C 20 32 40 25 50 25 C 60 25 80 32 78 54 C 63 57 37 57 22 54 Z" fill="#a1582e" stroke="#6d3816" stroke-width="3"/>
          </svg>`
      },
      {
        id: 'strawberry',
        name: 'Fresa',
        svg: `
          <svg viewBox="0 0 100 100" class="w-4/5 h-4/5 filter drop-shadow-sm">
            <!-- Sépalos verdes superiores -->
            <g fill="#43a047" stroke="#2e7d32" stroke-width="2">
              <polygon points="50,22 42,32 50,30 58,32"/>
              <polygon points="50,22 34,26 44,32"/>
              <polygon points="50,22 66,26 56,32"/>
            </g>
            <!-- Cuerpo rojo en forma de corazón invertido -->
            <path d="M 50 32 C 34 26 24 40 26 56 C 28 68 42 80 50 83 C 58 80 72 68 74 56 C 76 40 66 26 50 32 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2.5"/>
            <!-- Semillas amarillas -->
            <g fill="#ffee58">
              <ellipse cx="38" cy="45" rx="1.5" ry="2.5" transform="rotate(-15 38 45)"/>
              <ellipse cx="50" cy="43" rx="1.5" ry="2.5"/>
              <ellipse cx="62" cy="45" rx="1.5" ry="2.5" transform="rotate(15 62 45)"/>
              <ellipse cx="35" cy="57" rx="1.5" ry="2.5" transform="rotate(-20 35 57)"/>
              <ellipse cx="48" cy="55" rx="1.5" ry="2.5"/>
              <ellipse cx="63" cy="57" rx="1.5" ry="2.5" transform="rotate(20 63 57)"/>
              <ellipse cx="43" cy="67" rx="1.5" ry="2.5" transform="rotate(-10 43 67)"/>
              <ellipse cx="55" cy="67" rx="1.5" ry="2.5" transform="rotate(10 55 67)"/>
            </g>
          </svg>`
      },
      // Elementos extra para modo Experto (24 cartas)
      {
        id: 'orange',
        name: 'Naranja',
        svg: `
          <svg viewBox="0 0 100 100" class="w-4/5 h-4/5 filter drop-shadow-sm">
            <path d="M 50 25 C 50 18 53 14 56 12" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
            <path d="M 52 20 C 60 16 68 18 69 22 C 65 25 57 24 52 20 Z" fill="#43a047"/>
            <circle cx="50" cy="54" r="28" fill="#fb8c00" stroke="#e65100" stroke-width="2.5"/>
            <circle cx="40" cy="44" r="4" fill="#ffe082" opacity="0.7"/>
          </svg>`
      },
      {
        id: 'pear',
        name: 'Pera',
        svg: `
          <svg viewBox="0 0 100 100" class="w-4/5 h-4/5 filter drop-shadow-sm">
            <path d="M 50 24 C 50 16 54 13 57 12" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
            <path d="M 50 32 C 40 32 40 44 32 56 C 24 68 34 82 50 82 C 66 82 76 68 68 56 C 60 44 60 32 50 32 Z" fill="#c0ca33" stroke="#827717" stroke-width="2.5"/>
          </svg>`
      }
    ];

    let currentDifficulty = 'classic'; // 'easy' (6 pares), 'classic' (10 pares), 'hard' (12 pares)
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let totalPairs = 10;
    let isLocked = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let gameStarted = false;
    let soundEnabled = true;

    // Elementos del DOM
    const gridBoard = document.getElementById('gridBoard');
    const moveCountEl = document.getElementById('moveCount');
    const matchCountEl = document.getElementById('matchCount');
    const totalPairsLabel = document.getElementById('totalPairsLabel');
    const timerTextEl = document.getElementById('timerText');
    const starContainerEl = document.getElementById('starContainer');
    const btnRestart = document.getElementById('btnRestart');
    const btnHint = document.getElementById('btnHint');
    const btnSound = document.getElementById('btnSound');
    const soundIcon = document.getElementById('soundIcon');
    const diffButtons = document.querySelectorAll('.diff-btn');
    const winModal = document.getElementById('winModal');
    const winCard = document.getElementById('winCard');
    const winTimeEl = document.getElementById('winTime');
    const winMovesEl = document.getElementById('winMoves');
    const winStarsEl = document.getElementById('winStars');
    const btnPlayAgain = document.getElementById('btnPlayAgain');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const bestRecordText = document.getElementById('bestRecordText');

    let synth = null;
    let polySynth = null;

    function initAudio() {
      if (!window.Tone) return;
      try {
        if (!synth) {
          synth = new Tone.Synth({
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.15 }
          }).toDestination();
          synth.volume.value = -8;
        }
        if (!polySynth) {
          polySynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'sine' },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.3 }
          }).toDestination();
          polySynth.volume.value = -10;
        }
      } catch (err) {
        console.warn("Audio Context init warning:", err);
      }
    }

    // Reproducción de efectos sonoros
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (window.Tone && Tone.context.state !== 'running') {
          Tone.start();
        }
        initAudio();
        const now = Tone.now();

        if (type === 'flip' && synth) {
          synth.triggerAttackRelease('E5', '32n', now);
        } else if (type === 'match' && polySynth) {
          polySynth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '16n', now);
        } else if (type === 'mismatch' && synth) {
          synth.triggerAttackRelease('A3', '16n', now);
        } else if (type === 'win' && polySynth) {
          polySynth.triggerAttackRelease(['G4', 'C5', 'E5'], '16n', now);
          setTimeout(() => {
            if (polySynth) polySynth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '8n');
          }, 180);
        } else if (type === 'hint' && synth) {
          synth.triggerAttackRelease('F5', '32n', now);
        }
      } catch (e) {
        // En caso de bloqueo de audio del navegador, degradación silenciosa sin errores
      }
    }

    function setupGame() {
      stopTimer();
      secondsElapsed = 0;
      gameStarted = false;
      timerTextEl.textContent = '00:00';
      moves = 0;
      matchedPairs = 0;
      flippedCards = [];
      isLocked = false;
      moveCountEl.textContent = '0';
      matchCountEl.textContent = '0';
      updateStars();
      updateBestScoreDisplay();

      // Configuración según dificultad seleccionada
      let numPairs = 10;
      let gridColsClass = 'grid-cols-5';
      let aspectClass = 'aspect-[5/4]';

      if (currentDifficulty === 'easy') {
        numPairs = 6;
        gridColsClass = 'grid-cols-3 sm:grid-cols-4';
        aspectClass = 'aspect-[4/3]';
      } else if (currentDifficulty === 'classic') {
        numPairs = 10;
        gridColsClass = 'grid-cols-4 sm:grid-cols-5';
        aspectClass = 'aspect-[5/4]';
      } else if (currentDifficulty === 'hard') {
        numPairs = 12;
        gridColsClass = 'grid-cols-4 sm:grid-cols-6';
        aspectClass = 'aspect-[6/4]';
      }

      totalPairs = numPairs;
      totalPairsLabel.textContent = `/${totalPairs}`;

      // Ajustar clases del contenedor del tablero
      gridBoard.className = `grid gap-2 sm:gap-3.5 w-full max-w-[640px] p-1.5 sm:p-2.5 ${gridColsClass} ${aspectClass}`;

      // Seleccionar los elementos del conjunto
      const selectedItems = ITEMS_COLLECTION.slice(0, numPairs);

      // Crear pares de cartas
      const deck = [];
      selectedItems.forEach((item, index) => {
        deck.push({ id: `${item.id}-a`, itemId: item.id, svg: item.svg, name: item.name });
        deck.push({ id: `${item.id}-b`, itemId: item.id, svg: item.svg, name: item.name });
      });

      // Mezcla de Fisher-Yates
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      cards = deck;

      // Renderizar las cartas en el HTML
      gridBoard.innerHTML = '';
      deck.forEach((card, index) => {
        const cardScene = document.createElement('div');
        cardScene.className = 'card-scene w-full h-full';

        const cardContainer = document.createElement('div');
        cardContainer.className = 'card-container';
        cardContainer.dataset.index = index;
        cardContainer.dataset.itemId = card.itemId;
        cardContainer.setAttribute('role', 'button');
        cardContainer.setAttribute('aria-label', `Carta ${index + 1}`);

        // Reverso de la carta (patrón morado como en la referencia)
        const backFace = document.createElement('div');
        backFace.className = 'card-face card-back';
        backFace.innerHTML = `
          <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-white/20 flex items-center justify-center border border-white/30 text-white/70 text-xs sm:text-sm font-black">
            ✦
          </div>
        `;

        // Frente de la carta (marco lila y vector limpio en fondo blanco)
        const frontFace = document.createElement('div');
        frontFace.className = 'card-face card-front p-1.5 sm:p-2 flex items-center justify-center';
        frontFace.innerHTML = card.svg;

        cardContainer.appendChild(backFace);
        cardContainer.appendChild(frontFace);
        cardScene.appendChild(cardContainer);
        gridBoard.appendChild(cardScene);

        // Evento de clic y toque en la carta
        cardContainer.addEventListener('click', () => handleCardClick(cardContainer, card));
      });
    }

    function handleCardClick(cardContainer, card) {
      if (isLocked) return;
      if (cardContainer.classList.contains('is-flipped')) return;
      if (cardContainer.classList.contains('is-matched')) return;

      // Iniciar el cronómetro en el primer movimiento
      if (!gameStarted) {
        startTimer();
        gameStarted = true;
      }

      // Voltear la carta seleccionada
      cardContainer.classList.add('is-flipped');
      playSound('flip');

      flippedCards.push({ container: cardContainer, data: card });

      if (flippedCards.length === 2) {
        moves++;
        moveCountEl.textContent = moves;
        updateStars();
        checkMatch();
      }
    }

    // Verificar si las dos cartas volteadas coinciden
    function checkMatch() {
      isLocked = true;
      const [card1, card2] = flippedCards;

      if (card1.data.itemId === card2.data.itemId) {
        // ¡Coincidencia acertada!
        setTimeout(() => {
          card1.container.classList.add('is-matched');
          card2.container.classList.add('is-matched');
          playSound('match');

          matchedPairs++;
          matchCountEl.textContent = matchedPairs;
          flippedCards = [];
          isLocked = false;

          // Verificar condición de victoria
          if (matchedPairs === totalPairs) {
            handleVictory();
          }
        }, 320);
      } else {
        // Desacierto: animar sacudida y volver a ocultar
        setTimeout(() => {
          card1.container.classList.add('shake');
          card2.container.classList.add('shake');
          playSound('mismatch');
        }, 350);

        setTimeout(() => {
          card1.container.classList.remove('is-flipped', 'shake');
          card2.container.classList.remove('is-flipped', 'shake');
          flippedCards = [];
          isLocked = false;
        }, 900);
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerTextEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // Cálculo dinámico de estrellas según cantidad de movimientos
    function calculateStars() {
      const optimalMoves = totalPairs;
      if (moves <= optimalMoves + 3) return 3;
      if (moves <= optimalMoves * 1.8) return 2;
      return 1;
    }

    function updateStars() {
      const stars = calculateStars();
      let starStr = '';
      for (let i = 0; i < 3; i++) {
        starStr += `<span class="${i < stars ? 'text-amber-400' : 'text-slate-300'}">★</span>`;
      }
      starContainerEl.innerHTML = starStr;
    }

    function handleVictory() {
      stopTimer();
      playSound('win');

      // Lanzar confeti festivo
      if (window.confetti) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
        setTimeout(() => {
          confetti({
            particleCount: 50,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 50,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
        }, 250);
      }

      // Guardar mejor récord en localStorage
      saveBestRecord();

      // Configurar y mostrar el modal de victoria
      const finalStars = calculateStars();
      winTimeEl.textContent = timerTextEl.textContent;
      winMovesEl.textContent = `${moves} intentos`;
      winStarsEl.textContent = '★'.repeat(finalStars) + '☆'.repeat(3 - finalStars);

      setTimeout(() => {
        winModal.classList.remove('opacity-0', 'pointer-events-none');
        winCard.classList.remove('scale-90');
        winCard.classList.add('scale-100');
      }, 500);
    }

    function saveBestRecord() {
      const key = `memory_record_${currentDifficulty}`;
      const prevRecord = localStorage.getItem(key);
      if (!prevRecord || secondsElapsed < parseInt(prevRecord, 10)) {
        localStorage.setItem(key, secondsElapsed);
        updateBestScoreDisplay();
      }
    }

    function updateBestScoreDisplay() {
      const key = `memory_record_${currentDifficulty}`;
      const best = localStorage.getItem(key);
      if (best) {
        const mins = String(Math.floor(best / 60)).padStart(2, '0');
        const secs = String(best % 60).padStart(2, '0');
        bestRecordText.textContent = `${mins}:${secs}`;
      } else {
        bestRecordText.textContent = '--:--';
      }
    }

    // Pista: revela dos cartas no emparejadas durante 1 segundo
    function triggerHint() {
      if (isLocked) return;
      const unmatchedContainers = Array.from(document.querySelectorAll('.card-container:not(.is-matched):not(.is-flipped)'));
      if (unmatchedContainers.length < 2) return;

      // Buscar si hay dos cartas del mismo tipo para mostrarlas brevemente
      const map = {};
      let pairFound = null;

      for (let container of unmatchedContainers) {
        const itemId = container.dataset.itemId;
        if (map[itemId]) {
          pairFound = [map[itemId], container];
          break;
        }
        map[itemId] = container;
      }

      const cardsToPeek = pairFound || [unmatchedContainers[0], unmatchedContainers[1]];

      isLocked = true;
      playSound('hint');
      cardsToPeek.forEach(c => c.classList.add('is-flipped'));

      setTimeout(() => {
        cardsToPeek.forEach(c => c.classList.remove('is-flipped'));
        isLocked = false;
      }, 1000);
    }

    // Botón de pista
    btnHint.addEventListener('click', triggerHint);

    // Botón de reinicio
    btnRestart.addEventListener('click', () => {
      playSound('flip');
      setupGame();
    });

    // Botón de Sonido (Alternar)
    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled && window.Tone) {
        Tone.start();
        playSound('flip');
      }
    });

    // Selección de dificultad
    diffButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        diffButtons.forEach(b => {
          b.classList.remove('bg-white', 'text-purple-800', 'shadow-sm');
          b.classList.add('hover:bg-white/60');
        });
        btn.classList.add('bg-white', 'text-purple-800', 'shadow-sm');
        btn.classList.remove('hover:bg-white/60');

        currentDifficulty = btn.dataset.diff;
        setupGame();
      });
    });

    // Controles del modal de victoria
    btnPlayAgain.addEventListener('click', () => {
      winModal.classList.add('opacity-0', 'pointer-events-none');
      winCard.classList.remove('scale-100');
      winCard.classList.add('scale-90');
      setupGame();
    });

    btnCloseModal.addEventListener('click', () => {
      winModal.classList.add('opacity-0', 'pointer-events-none');
      winCard.classList.remove('scale-100');
      winCard.classList.add('scale-90');
    });

    // Iniciar el juego automáticamente al cargar la ventana
    window.addEventListener('load', () => {
      setupGame();
    });
  </script>
